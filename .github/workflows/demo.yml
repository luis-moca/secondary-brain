name: Demo en línea

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"   # diario a las 7:00 hora de CDMX: fechas, pendientes y escaneo del demo al día
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: macos-latest   # miniaturas con las herramientas de macOS (qlmanage y sips)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 second-brain/publicar_demo.py --salida _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
